<style>
/* A camera is always dark: both color schemes share the same viewfinder palette */
:root{
  --ink:#F7F4EE; --dim:rgba(247,244,238,.58); --faint:rgba(247,244,238,.18);
  --accent:#FFB547; --accent-ink:#2B1A02;
  --glass:rgba(22,24,30,.46); --glass-line:rgba(255,255,255,.14);
  --bg:#000;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000; } }
:root[data-theme="dark"]{ --bg:#000; }
*,*::before,*::after{box-sizing:border-box}
html{height:100%;background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI","Yu Gothic",system-ui,sans-serif;
  font-feature-settings:"palt";letter-spacing:.02em;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-user-select:none;user-select:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.glass{background:var(--glass);border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5)}

/* viewfinder: full bleed under the system bars */
.vf{position:fixed;inset:0;background:#000;overflow:hidden;touch-action:pan-y}
.vf video,.vf .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf video.mirror{transform:scaleX(-1)}
.vf .still{display:none}
#guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .25s}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .3s ease-out}
@keyframes fl{0%{opacity:.8}100%{opacity:0}}

/* big composition name, shown briefly when the guide changes */
.bigname{position:fixed;left:0;right:0;top:38%;text-align:center;pointer-events:none;opacity:0;
  font-size:2.25rem;font-weight:300;letter-spacing:.12em;text-shadow:0 2px 18px rgba(0,0,0,.55)}

.bigname.show{animation:nm 1.1s ease-out}
@keyframes nm{0%{opacity:0;transform:translateY(6px)}18%{opacity:1;transform:none}70%{opacity:1}100%{opacity:0}}

/* top controls */
.top{position:fixed;top:0;left:0;right:0;z-index:5;pointer-events:none;
  padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 0;display:flex;align-items:center;gap:8px}
.top > *{pointer-events:auto}
.pill{height:38px;border-radius:19px;padding:0 14px 0 11px;display:inline-flex;align-items:center;gap:7px;font-size:.8125rem}
.pill svg{width:17px;height:17px}
.spacer{flex:1}
.round{width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.round svg{width:19px;height:19px}
.round[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.round[hidden]{display:none}

/* bottom controls */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;pointer-events:none;
  padding:56px 0 calc(env(safe-area-inset-bottom,0px) + 14px);
  background:linear-gradient(to top,rgba(0,0,0,.72) 0%,rgba(0,0,0,.45) 55%,rgba(0,0,0,0) 100%)}
.bottom > *{pointer-events:auto}
.tip{margin:0 auto 12px;max-width:26em;padding:0 24px;text-align:center;font-size:.8125rem;line-height:1.7;color:var(--dim);min-height:2.2em}
.dial{position:relative}
.dial::after{content:"";position:absolute;left:50%;bottom:-2px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
.modes{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;
  padding:4px 50% 12px;-webkit-mask-image:linear-gradient(to right,transparent,#000 22%,#000 78%,transparent);
          mask-image:linear-gradient(to right,transparent,#000 22%,#000 78%,transparent)}
.modes::-webkit-scrollbar{display:none}
.mode{flex:0 0 auto;scroll-snap-align:center;padding:6px 10px;font-size:.9375rem;color:var(--dim);white-space:nowrap;transition:color .2s}
.mode[aria-pressed="true"]{color:var(--accent);font-weight:600}
.row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 28px 0}
.thumb{justify-self:start;width:46px;height:46px;border-radius:10px;overflow:hidden;border:1.5px solid rgba(255,255,255,.7);visibility:hidden}
.thumb.has{visibility:visible}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.shutter{width:76px;height:76px;border-radius:50%;border:3.5px solid #fff;padding:5px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:#fff;transition:transform .12s}
.shutter:active span{transform:scale(.88)}
.shutter:disabled{opacity:.35}
.variant{justify-self:end;width:46px;height:46px;border-radius:50%;display:grid;place-items:center}
.variant svg{width:21px;height:21px}
.variant:disabled{opacity:.3;cursor:default}

/* start screen */
.start{position:fixed;inset:0;z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:calc(env(safe-area-inset-top,0px) + 24px) 28px calc(env(safe-area-inset-bottom,0px) + 24px);
  background:#000;text-align:center}
.start .mark{width:min(64vw,260px);aspect-ratio:1.618/1;margin-bottom:18px}
.start .mark path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s .2s cubic-bezier(.6,0,.2,1) forwards}
.start .mark rect,.start .mark line{opacity:0;animation:fade .8s 1.4s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.start h1{margin:0;font-size:2rem;font-weight:300;letter-spacing:.24em;padding-left:.24em}
.start p{margin:0 0 22px;font-size:.875rem;line-height:1.8;color:var(--dim);max-width:20em}
.cta{min-width:220px;height:52px;border-radius:26px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:1rem;letter-spacing:.08em}
.ghost{min-width:220px;height:46px;font-size:.875rem;color:var(--dim)}
.err{color:#FFC98A;font-size:.8125rem;line-height:1.7;max-width:22em;margin-top:6px}

/* preview + editing */
.sheet{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:#000;
  padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + 10px);
  visibility:hidden;opacity:0;transform:translateY(16px);transition:opacity .25s,transform .25s,visibility 0s .25s}
.sheet.open{visibility:visible;opacity:1;transform:none;transition:opacity .25s,transform .25s}
.sbar{display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
.sbar .close{height:36px;padding:0 6px;font-size:.9375rem;color:var(--ink)}
.acts2{display:flex;gap:8px}
.sbar .share{height:36px;border-radius:18px;padding:0 16px;font-size:.875rem}
.sbar .share:disabled{opacity:.5}
.sbar .save{height:36px;border-radius:18px;padding:0 18px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:.875rem}
.sbar .save:disabled{opacity:.5}
.imgwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 14px;touch-action:none}
.imgwrap canvas{max-width:100%;max-height:100%;border-radius:4px;display:block}
.diag{margin:10px auto 0;padding:0 22px;max-width:30em;text-align:center;font-size:.75rem;line-height:1.7;color:var(--dim);min-height:1.7em}
.presets{display:flex;gap:12px;overflow-x:auto;padding:12px 18px 4px;scrollbar-width:none;justify-content:safe center}
.presets::-webkit-scrollbar{display:none}
.pre{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.6875rem;color:var(--dim)}
.pre canvas{width:58px;height:58px;border-radius:10px;display:block;outline:1.5px solid transparent;outline-offset:2px;transition:outline-color .15s}
.pre[aria-pressed="true"]{color:var(--accent)}
.pre[aria-pressed="true"] canvas{outline-color:var(--accent)}
.tools{display:flex;justify-content:center;gap:4px;padding:12px 10px 0}
.tool{display:flex;flex-direction:column;align-items:center;min-width:70px;padding:4px 6px;font-size:.75rem;color:var(--dim)}
.tool b{font-weight:500;font-size:.6875rem;font-variant-numeric:tabular-nums;margin-top:2px;opacity:.8}
.tool[aria-pressed="true"]{color:var(--ink)}
.tool[aria-pressed="true"] b{color:var(--accent);opacity:1}
.slider{padding:6px 28px 0}
.slider input{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;margin:0}
.slider input::-webkit-slider-runnable-track{height:2px;border-radius:1px;
  background:linear-gradient(to right,var(--faint) calc(50% - 1px),var(--ink) calc(50% - 1px),var(--ink) calc(50% + 1px),var(--faint) calc(50% + 1px))}
.slider input::-moz-range-track{height:2px;background:var(--faint)}
.slider input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 0 0 4px rgba(255,181,71,.35)}
.slider input::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:#fff}
.msg{text-align:center;font-size:.75rem;min-height:1.5em;padding-top:4px;color:var(--accent)}
.msg:empty::before{content:"写真を長押しすると補正前を表示";color:var(--dim)}
.appshare{margin-top:18px;display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;color:var(--dim);height:40px}
.appshare svg{width:16px;height:16px}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){
  .flash.on,.bigname.show{animation:none}
  .start .mark path{animation:none;stroke-dashoffset:0}
  .start .mark rect,.start .mark line{animation:none;opacity:1}
  .sheet,.sheet.open{transition:none}
}
</style>

<script>
(() => {
const PHI = (1 + Math.sqrt(5)) / 2;
const GUIDE = '#FFF7E6', ACC = '#FFB547';
const f = n => Math.round(n * 10) / 10;

/* drawing primitives */
function prims(sw, col, acc){
  const st = (op) => `stroke="${col}" stroke-width="${sw}" stroke-opacity="${op}" stroke-linecap="round" stroke-linejoin="round"`;
  return {
    L:(x1,y1,x2,y2,op=1,dash)=>`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" ${st(op)}${dash?` stroke-dasharray="${dash}"`:''}/>`,
    P:(d,op=1)=>`<path d="${d}" fill="none" ${st(op)}/>`,
    PL:(pts,op=1)=>`<polyline points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="none" ${st(op)}/>`,
    C:(cx,cy,r,op=1)=>`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="none" ${st(op)}/>`,
    D:(cx,cy)=>`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(sw*2.4)}" fill="${acc}"/>`,
    SHADE:(d,op)=>`<path d="${d}" fill="#000" fill-opacity="${op}" fill-rule="evenodd"/>`,
    sw
  };
}

/* golden spiral in a PHI x 1 box, returned as unit points */
function spiralPts(){
  let x=0,y=0,w=PHI,h=1; const pts=[];
  for(let i=0;i<11;i++){
    const k=i%4; let s,cx,cy,a0;
    if(k===0){s=h;cx=x+s;cy=y+s;a0=Math.PI;}
    if(k===1){s=w;cx=x;cy=y+s;a0=-Math.PI/2;}
    if(k===2){s=h;cx=x+w-s;cy=y;a0=0;}
    if(k===3){s=w;cx=x+w;cy=y+h-s;a0=Math.PI/2;}
    for(let j=(i?1:0);j<=14;j++){const a=a0+(Math.PI/2)*(j/14);pts.push([cx+s*Math.cos(a),cy+s*Math.sin(a)]);}
    if(k===0){x+=s;w-=s;} if(k===1){y+=s;h-=s;} if(k===2){w-=s;} if(k===3){h-=s;}
  }
  return pts;
}
const SPIRAL = spiralPts();
const EYE = [1.1708, 0.7236];

const COMPS = [
 {name:'日の丸',tip:'主役を画面の真ん中に。背景をシンプルにすると主役が強く伝わります。',
  draw:(W,H,v,g)=>{const r=Math.min(W,H)*.17,c=Math.min(W,H)*.04;
   return g.C(W/2,H/2,r,.9)+g.L(W/2-c,H/2,W/2+c,H/2)+g.L(W/2,H/2-c,W/2,H/2+c);}},
 {name:'三分割',tip:'主役を線の交点に置き、地平線は上か下の線に合わせます。',
  draw:(W,H,v,g)=>{let s='';for(const t of [1/3,2/3]){s+=g.L(W*t,0,W*t,H)+g.L(0,H*t,W,H*t);}
   for(const a of [1/3,2/3])for(const b of [1/3,2/3])s+=g.D(W*a,H*b);return s;}},
 {name:'二分割',tip:'空と地面、水面と景色などを半分ずつに。対称な被写体と好相性です。',variants:2,
  draw:(W,H,v,g)=>v?g.L(W/2,0,W/2,H):g.L(0,H/2,W,H/2)},
 {name:'四分割',tip:'三分割より細かく配置を決めたいときに。線上や交点に要素を置きます。',
  draw:(W,H,v,g)=>{let s='';for(const t of [.25,.5,.75]){const op=t===.5?1:.65;s+=g.L(W*t,0,W*t,H,op)+g.L(0,H*t,W,H*t,op);}return s;}},
 {name:'対角線',tip:'被写体を対角線に沿わせると、奥行きと動きが生まれます。',variants:2,mirror:true,
  draw:(W,H,v,g)=>{const len=Math.hypot(W,H),dx=W/len,dy=-H/len;
   const foot=(px,py)=>{const t=(px-0)*dx+(py-H)*dy;return [t*dx,H+t*dy];};
   const a=foot(0,0),b=foot(W,H);
   return g.L(0,H,W,0)+g.L(0,0,a[0],a[1],.55,'6 6')+g.L(W,H,b[0],b[1],.55,'6 6')+g.D(a[0],a[1])+g.D(b[0],b[1]);}},
 {name:'斜線',tip:'道や手すり、影などを斜めに入れて、リズムとスピード感を出します。',variants:2,mirror:true,
  draw:(W,H,v,g)=>{let s='';for(const o of [-.38,0,.38])s+=g.L(0,H*(.95+o),W,H*(.3+o),o?.7:1);return s;}},
 {name:'三角',tip:'底辺を広く、頂点に視線を集めます。山や人物の全身に安定感が出ます。',
  draw:(W,H,v,g)=>g.P(`M${f(W*.08)} ${f(H*.86)} L${f(W/2)} ${f(H*.2)} L${f(W*.92)} ${f(H*.86)} Z`)+g.D(W/2,H*.2)},
 {name:'逆三角',tip:'上を広く下をすぼめると、不安定さから緊張感や動きが生まれます。',
  draw:(W,H,v,g)=>g.P(`M${f(W*.08)} ${f(H*.14)} L${f(W/2)} ${f(H*.8)} L${f(W*.92)} ${f(H*.14)} Z`)+g.D(W/2,H*.8)},
 {name:'シンメトリー',tip:'中心線で左右（または上下）を対称に。建物や水面の映り込みに向きます。',variants:2,
  draw:(W,H,v,g)=>{const a=Math.min(W,H)*.06;
   if(!v)return g.L(W/2,0,W/2,H,1,'10 7')+g.P(`M${f(W/2-a*2)} ${f(H/2-a)} l${f(-a)} ${f(a)} l${f(a)} ${f(a)}`,.8)+g.P(`M${f(W/2+a*2)} ${f(H/2-a)} l${f(a)} ${f(a)} l${f(-a)} ${f(a)}`,.8);
   return g.L(0,H/2,W,H/2,1,'10 7')+g.P(`M${f(W/2-a)} ${f(H/2-a*2)} l${f(a)} ${f(-a)} l${f(a)} ${f(a)}`,.8)+g.P(`M${f(W/2-a)} ${f(H/2+a*2)} l${f(a)} ${f(a)} l${f(a)} ${f(-a)}`,.8);}},
 {name:'黄金螺旋',tip:'渦の中心に主役を置くと、自然で美しいバランスになります。',variants:4,mirror:true,
  draw:(W,H,v,g)=>{const land=W>=H;
   const map=([u,t])=>land?[u/PHI*W,t*H]:[(1-t)*W,u/PHI*H];
   let s='';for(const t of [1-1/PHI,1/PHI]){s+=g.L(W*t,0,W*t,H,.4)+g.L(0,H*t,W,H*t,.4);}
   s+=g.PL(SPIRAL.map(map));const e=map(EYE);return s+g.D(e[0],e[1]);}},
 {name:'S字',tip:'川や道のS字カーブで、視線を手前から奥へ導きます。',variants:2,mirror:true,
  draw:(W,H,v,g)=>g.P(`M${f(W*.32)} ${f(H)} C${f(W*.95)} ${f(H*.82)} ${f(W*.92)} ${f(H*.56)} ${f(W*.5)} ${f(H*.5)} S${f(W*.06)} ${f(H*.2)} ${f(W*.62)} 0`)},
 {name:'C字',tip:'海岸線や弧を描く道で、画面を包み込むような広がりを出します。',variants:2,mirror:true,
  draw:(W,H,v,g)=>g.P(`M${f(W*.82)} ${f(H*.04)} C${f(W*.02)} ${f(H*.18)} ${f(W*.02)} ${f(H*.82)} ${f(W*.82)} ${f(H*.96)}`)},
 {name:'放射線',tip:'一点から広がる線で奥行きと迫力を。中心の点に主役を置きます。',variants:2,
  draw:(W,H,v,g)=>{const px=W/2,py=v?H*2/3:H/2,R=Math.hypot(W,H);let s='';
   for(let i=0;i<16;i++){const a=i/16*Math.PI*2+Math.PI/16;s+=g.L(px+Math.cos(a)*R*.08,py+Math.sin(a)*R*.08,px+Math.cos(a)*R,py+Math.sin(a)*R,.75);}
   return s+g.D(px,py);}},
 {name:'トンネル',tip:'窓やトンネル、木々で手前に枠を作り、奥の主役を囲みます。',
  draw:(W,H,v,g)=>{const ix=W*.16,iy=H*.14,r=Math.min(W,H)*.06,w=W-ix*2,h=H-iy*2;
   const inner=`M${f(ix+r)} ${f(iy)} h${f(w-2*r)} a${f(r)} ${f(r)} 0 0 1 ${f(r)} ${f(r)} v${f(h-2*r)} a${f(r)} ${f(r)} 0 0 1 ${f(-r)} ${f(r)} h${f(-(w-2*r))} a${f(r)} ${f(r)} 0 0 1 ${f(-r)} ${f(-r)} v${f(-(h-2*r))} a${f(r)} ${f(r)} 0 0 1 ${f(r)} ${f(-r)} Z`;
   return g.SHADE(`M0 0 H${f(W)} V${f(H)} H0 Z `+inner,.28)+g.P(inner)+g.D(W/2,H/2);}},
 {name:'パターン',tip:'同じ形の繰り返しで画面を埋めます。ひとつだけ崩すと印象的になります。',
  draw:(W,H,v,g)=>{const cols=4,rows=Math.max(3,Math.round(cols*H/W)),cw=W/cols,ch=H/rows,r=Math.min(cw,ch)*.24;let s='';
   for(let i=1;i<cols;i++)s+=g.L(cw*i,0,cw*i,H,.3);for(let j=1;j<rows;j++)s+=g.L(0,ch*j,W,ch*j,.3);
   for(let i=0;i<cols;i++)for(let j=0;j<rows;j++)s+=g.C(cw*(i+.5),ch*(j+.5),r,.85);return s;}}
];

function buildInner(c, W, H, v, sw, col, acc){
  const g = prims(sw, col, acc);
  let inner = c.draw(W, H, v, g);
  if(c.mirror && v){
    const mx = v & 1, my = v & 2;
    inner = `<g transform="translate(${mx?W:0} ${my?H:0}) scale(${mx?-1:1} ${my?-1:1})">${inner}</g>`;
  }
  return inner;
}
function buildSvg(c, W, H, v, sw){
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`+
    `<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="0" stdDeviation="${f(sw*.8)}" flood-color="#000" flood-opacity=".65"/></filter></defs>`+
    `<g filter="url(#sh)">${buildInner(c,W,H,v,sw,GUIDE,ACC)}</g></svg>`;
}


/* state */
const $ = id => document.getElementById(id);
const vf=$('vf'), video=$('video'), still=$('still'), guide=$('guide'), modes=$('modes');
let idx=1, variant=0, opLevel=0, burn=false, facing='environment', stream=null, source=null, downloads=null, ready=false;
const OPS=[{l:'ガイド 濃い',o:1},{l:'ガイド 薄い',o:.45},{l:'ガイド なし',o:0}];

/* start-screen spiral */
$('startSpiral').setAttribute('d','M'+SPIRAL.map(p=>f(p[0]*100)+' '+f(p[1]*100)).join(' L'));

/* composition dial */
COMPS.forEach((c,i)=>{
  const b=document.createElement('button');b.className='mode';b.type='button';b.textContent=c.name;
  b.addEventListener('click',()=>select(i));
  modes.appendChild(b);
});
let scrollTimer=null, programmatic=false;
modes.addEventListener('scroll',()=>{
  clearTimeout(scrollTimer);
  scrollTimer=setTimeout(()=>{
    if(programmatic){programmatic=false;return;}
    const mid=modes.getBoundingClientRect().left+modes.clientWidth/2;
    let best=idx,bd=1e9;
    [...modes.children].forEach((b,i)=>{const r=b.getBoundingClientRect();const d=Math.abs(r.left+r.width/2-mid);if(d<bd){bd=d;best=i;}});
    if(best!==idx)select(best,{scroll:false});
  },90);
},{passive:true});

function render(){
  const W=vf.clientWidth,H=vf.clientHeight; if(!W||!H)return;
  const sw=Math.max(1.5,Math.min(W,H)/240);
  guide.setAttribute('viewBox',`0 0 ${W} ${H}`);
  guide.innerHTML=buildSvg(COMPS[idx],W,H,variant,sw).replace(/^<svg[^>]*>|<\/svg>$/g,'');
  guide.style.opacity=OPS[opLevel].o;
}
function select(i,opts={}){
  const n=(i+COMPS.length)%COMPS.length, changed=n!==idx;
  idx=n; variant=0;
  const c=COMPS[idx];
  $('tip').textContent=c.tip;
  [...modes.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===idx));
  if(opts.scroll!==false){programmatic=true;modes.children[idx].scrollIntoView({behavior:opts.instant?'auto':'smooth',inline:'center',block:'nearest'});}
  $('variantBtn').disabled=!(c.variants>1);
  if(changed&&ready){
    const bn=$('bigname');bn.innerHTML=`${c.name}<small>${idx+1} / ${COMPS.length}</small>`;
    bn.classList.remove('show');void bn.offsetWidth;bn.classList.add('show');
    navigator.vibrate?.(6);
  }
  render();
}
$('variantBtn').addEventListener('click',()=>{const n=COMPS[idx].variants||1;variant=(variant+1)%n;render();});
$('opBtn').addEventListener('click',()=>{opLevel=(opLevel+1)%OPS.length;$('opLabel').textContent=OPS[opLevel].l;render();});
$('burnBtn').addEventListener('click',e=>{burn=!burn;e.currentTarget.setAttribute('aria-pressed',burn);});
new ResizeObserver(render).observe(vf);

/* swipe on the viewfinder */
let sx=null,sy=null;
vf.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
vf.addEventListener('pointerup',e=>{
  if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)select(idx+(dx<0?1:-1));
});

/* camera */
function enterViewfinder(){$('start').style.display='none';$('shutter').disabled=false;ready=true;}
function showErr(msg){const el=$('err');el.textContent=msg;el.hidden=false;$('start').style.display='flex';}
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia){showErr('このブラウザではカメラを使えません。「撮った写真で構図を確認」をお試しください。');return;}
  try{
    stream?.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1440}}});
    video.srcObject=stream; await video.play();
    video.classList.toggle('mirror',facing==='user');
    video.style.display='block'; still.style.display='none'; source='video';
    $('flipCam').hidden=false; enterViewfinder();
  }catch(err){
    const n=err&&err.name;
    showErr(n==='NotAllowedError'?'カメラの使用が許可されませんでした。設定でカメラを許可してから、もう一度お試しください。':
      n==='NotFoundError'?'カメラが見つかりませんでした。':'カメラを起動できませんでした（'+(n||'不明なエラー')+'）。');
  }
}
$('startCam').addEventListener('click',startCamera);
$('flipCam').addEventListener('click',()=>{facing=facing==='environment'?'user':'environment';startCamera();});
$('pickPhoto').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{
  const fl=e.target.files[0];if(!fl)return;
  still.onload=()=>{still.style.display='block';video.style.display='none';source='still';enterViewfinder();};
  still.src=URL.createObjectURL(fl); e.target.value='';
});

/* capture: keep the photo without guides so edits never tint the guide lines */
let shot=null;
async function capture(){
  const el=source==='video'?video:still;
  const iw=source==='video'?video.videoWidth:still.naturalWidth, ih=source==='video'?video.videoHeight:still.naturalHeight;
  if(!iw||!ih)return;
  const Dw=vf.clientWidth,Dh=vf.clientHeight,s=Math.max(Dw/iw,Dh/ih);
  const cw=Math.round(Dw/s),ch=Math.round(Dh/s),sx0=(iw-cw)/2,sy0=(ih-ch)/2;
  const base=document.createElement('canvas');base.width=cw;base.height=ch;const ctx=base.getContext('2d');
  ctx.save(); if(source==='video'&&facing==='user'){ctx.translate(cw,0);ctx.scale(-1,1);}
  ctx.drawImage(el,sx0,sy0,cw,ch,0,0,cw,ch); ctx.restore();
  const small=scaled(base,1280), tile=squareTile(base,120);
  shot={base,small,smallData:small.getContext('2d').getImageData(0,0,small.width,small.height),tile,
    guide:(burn&&OPS[opLevel].o>0)?{c:COMPS[idx],v:variant,o:OPS[opLevel].o}:null};
  const a=analyze(small); shot.auto=a.p; shot.note=a.note;
  const pv=$('pv');pv.width=small.width;pv.height=small.height;
  $('thumbImg').src=tile.toDataURL('image/jpeg',.8); $('thumb').classList.add('has');
  buildPresets(); applyPreset('auto'); openSheet();
}
function scaled(src,max){
  const k=Math.min(1,max/Math.max(src.width,src.height));
  const c=document.createElement('canvas');c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);
  const x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(src,0,0,c.width,c.height);return c;
}
function squareTile(src,n){
  const m=Math.min(src.width,src.height),c=document.createElement('canvas');c.width=c.height=n;
  c.getContext('2d').drawImage(src,(src.width-m)/2,(src.height-m)/2,m,m,0,0,n,n);return c;
}

/* analysis: brightness, tonal range, color cast and saturation */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function analyze(cv){
  const t=scaled(cv,200),d=t.getContext('2d').getImageData(0,0,t.width,t.height).data,n=d.length/4;
  const hist=new Uint32Array(256);let sr=0,sg=0,sb=0,ss=0;
  for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];
    hist[Math.round(.299*r+.587*g+.114*b)]++;sr+=r;sg+=g;sb+=b;
    const mx=Math.max(r,g,b),mn=Math.min(r,g,b);ss+=mx?(mx-mn)/mx:0;}
  const pct=q=>{let acc=0;for(let i=0;i<256;i++){acc+=hist[i];if(acc>=n*q)return i;}return 255;};
  let mean=0;for(let i=0;i<256;i++)mean+=i*hist[i];mean/=n*255;
  const range=(pct(.98)-pct(.02))/255, cast=(sb-sr)/n/255, msat=ss/n;
  const p={exp:0,con:0,sat:0,tmp:0,fade:0},note=[];
  if(mean<.42){p.exp=Math.round(clamp((.48-mean)*220,0,45));note.push('少し暗いので明るく');}
  else if(mean>.62){p.exp=-Math.round(clamp((mean-.55)*180,0,35));note.push('明るすぎる部分を抑えて');}
  if(range<.8){p.con=Math.round(clamp((.8-range)*90,0,30));note.push('メリハリを強めに');}
  if(cast<-.12){note.push('夕景のような暖かい色はそのまま活かして');}
  else if(Math.abs(cast)>.035){p.tmp=Math.round(clamp(cast*200,-25,25));note.push(cast>0?'青みを抑えて自然な色に':'黄みを抑えて自然な色に');}
  if(msat<.22){p.sat=Math.round(clamp((.3-msat)*150,0,25));note.push('色を少し鮮やかに');}
  const text=note.length?'おすすめ補正：'+note.join('、')+'しました。':'バランスの良い写真です。補正はほとんど必要ありません。';
  return {p,note:text};
}

/* processing: per-channel lookup tables + saturation */
function processData(src,p){
  const g=Math.pow(2,-p.exp/80),c=1+p.con/100,f=p.fade/100*.25,s=1+p.sat/100;
  const lut=k=>{const L=new Uint8ClampedArray(256);for(let i=0;i<256;i++){let v=Math.min(1,i/255*k);v=Math.pow(v,g);v=(v-.5)*c+.5;v=f+v*(1-f);L[i]=Math.round(clamp(v,0,1)*255);}return L;};
  const LR=lut(1+.15*p.tmp/100),LG=lut(1+.02*p.tmp/100),LB=lut(1-.15*p.tmp/100);
  const out=new ImageData(src.width,src.height),a=src.data,o=out.data;
  for(let i=0;i<a.length;i+=4){let r=LR[a[i]],gg=LG[a[i+1]],b=LB[a[i+2]];
    if(s!==1){const L=.299*r+.587*gg+.114*b;r=L+(r-L)*s;gg=L+(gg-L)*s;b=L+(b-L)*s;}
    o[i]=r;o[i+1]=gg;o[i+2]=b;o[i+3]=255;}
  return out;
}

/* presets and sliders */
const ADJ=[{k:'exp',n:'明るさ'},{k:'con',n:'コントラスト'},{k:'sat',n:'彩度'},{k:'tmp',n:'色温度'}];
const PRESETS=[
  {k:'orig',n:'オリジナル',f:a=>({exp:0,con:0,sat:0,tmp:0,fade:0})},
  {k:'auto',n:'おすすめ',f:a=>({...a})},
  {k:'vivid',n:'ビビッド',f:a=>({...a,con:a.con+15,sat:a.sat+35})},
  {k:'film',n:'フィルム',f:a=>({...a,con:a.con-12,sat:a.sat-18,tmp:a.tmp+14,fade:12})},
  {k:'mono',n:'モノクロ',f:a=>({...a,con:a.con+18,sat:-100,tmp:0})}
];
let params={exp:0,con:0,sat:0,tmp:0,fade:0}, tool='exp', rafId=0;
const fix=p=>{for(const k in p)p[k]=clamp(Math.round(p[k]),-100,100);return p;};
function buildPresets(){
  const box=$('presets');box.innerHTML='';
  const td=shot.tile.getContext('2d').getImageData(0,0,shot.tile.width,shot.tile.height);
  PRESETS.forEach(pr=>{
    const b=document.createElement('button');b.className='pre';b.type='button';b.dataset.k=pr.k;
    const c=document.createElement('canvas');c.width=c.height=shot.tile.width;
    c.getContext('2d').putImageData(processData(td,fix(pr.f(shot.auto))),0,0);
    b.append(c,pr.n);b.addEventListener('click',()=>applyPreset(pr.k));box.appendChild(b);
  });
}
function markPreset(k){[...$('presets').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));}
function applyPreset(k){
  params=fix(PRESETS.find(p=>p.k===k).f(shot.auto));markPreset(k);
  $('diag').textContent=k==='orig'?'補正前の写真です。':shot.note;
  updateTools();schedule();
}
const tools=$('tools');
ADJ.forEach(a=>{const b=document.createElement('button');b.className='tool';b.type='button';b.dataset.k=a.k;
  b.innerHTML=`${a.n}<b>0</b>`;b.addEventListener('click',()=>{tool=a.k;updateTools();});tools.appendChild(b);});
function updateTools(){
  [...tools.children].forEach(b=>{const v=params[b.dataset.k];b.setAttribute('aria-pressed',b.dataset.k===tool);
    b.querySelector('b').textContent=v>0?'+'+v:v;});
  $('rng').value=params[tool];
  $('rng').setAttribute('aria-label',ADJ.find(a=>a.k===tool).n);
}
$('rng').addEventListener('input',e=>{params[tool]=+e.target.value;markPreset('');updateTools();schedule();});
$('rng').addEventListener('dblclick',()=>{params[tool]=0;markPreset('');updateTools();schedule();});
function schedule(){cancelAnimationFrame(rafId);rafId=requestAnimationFrame(()=>$('pv').getContext('2d').putImageData(processData(shot.smallData,params),0,0));}
const wrap=$('imgwrap');
wrap.addEventListener('pointerdown',()=>{if(shot){cancelAnimationFrame(rafId);$('pv').getContext('2d').putImageData(shot.smallData,0,0);}});
['pointerup','pointercancel','pointerleave'].forEach(t=>wrap.addEventListener(t,()=>{if(shot)schedule();}));
wrap.addEventListener('contextmenu',e=>e.preventDefault());

function openSheet(){$('sheetMsg').textContent='';$('sheet').classList.add('open');}
$('shutter').addEventListener('click',()=>{
  const fl=$('flash');fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on');
  navigator.vibrate?.(12); capture();
});
$('thumb').addEventListener('click',()=>{if(shot)openSheet();});
$('retake').addEventListener('click',()=>$('sheet').classList.remove('open'));

/* full-resolution render for saving */
async function finalBlob(){
  const b=shot.base,out=document.createElement('canvas');out.width=b.width;out.height=b.height;
  const ctx=out.getContext('2d');
  ctx.putImageData(processData(b.getContext('2d').getImageData(0,0,b.width,b.height),params),0,0);
  const gd=shot.guide;
  if(gd){
    const svg=buildSvg(gd.c,b.width,b.height,gd.v,Math.max(2,Math.min(b.width,b.height)/240));
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    await new Promise(res=>{const im=new Image();im.onload=()=>{ctx.globalAlpha=gd.o;ctx.drawImage(im,0,0);ctx.globalAlpha=1;URL.revokeObjectURL(url);res();};im.onerror=res;im.src=url;});
  }
  return new Promise(r=>out.toBlob(r,'image/jpeg',.92));
}

/* saving: Claude artifact downloads, else the share sheet (iPhone: 画像を保存), else a download link */
(async()=>{try{if(window.claude?.use)downloads=await window.claude.use('downloads');}catch(e){downloads=null;}})();
function fname(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `kozu-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;}
const APP_URL='https://tennis226243-coder.github.io/kozu-camera/';
async function busy(fn){
  const msg=$('sheetMsg'),btns=[$('save'),$('shareBtn')];
  btns.forEach(x=>x.disabled=true);msg.textContent='書き出し中…';
  try{const blob=await finalBlob();msg.textContent='';await fn(blob,msg);}
  finally{btns.forEach(x=>x.disabled=false);}
}
function shareable(blob,name){const file=new File([blob],name,{type:'image/jpeg'});return navigator.canShare?.({files:[file]})?file:null;}
async function shareFile(file,msg,okText){
  try{await navigator.share({files:[file]});msg.textContent=okText;}
  catch(e){if(e?.name!=='AbortError')msg.textContent='共有できませんでした';}
}
$('save').addEventListener('click',()=>{if(shot)busy(async(blob,msg)=>{
  const name=fname();
  if(downloads){
    try{await downloads.save({filename:name,data:blob});msg.textContent='保存しました';}
    catch(e){msg.textContent=e?.code==='declined'?'保存をキャンセルしました':'保存できませんでした（'+(e?.code||'エラー')+'）';}
    return;
  }
  const file=shareable(blob,name);
  if(file)return shareFile(file,msg,'「画像を保存」で写真アプリに保存できます');
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  msg.textContent='保存しました';
});});
$('shareBtn').addEventListener('click',()=>{if(shot)busy(async(blob,msg)=>{
  const file=shareable(blob,fname());
  if(file)return shareFile(file,msg,'共有しました');
  msg.textContent='この画面では共有できません。保存してから写真アプリで共有してください';
});});
$('appShare').addEventListener('click',async()=>{
  const m=$('appMsg'),data={title:'カメラ',text:'15の構図ガイドで撮影できるカメラアプリ',url:APP_URL};
  if(navigator.share){try{await navigator.share(data);return;}catch(e){if(e?.name==='AbortError')return;}}
  try{await navigator.clipboard.writeText(APP_URL);m.textContent='URLをコピーしました';}
  catch(e){m.textContent=APP_URL;}
  m.hidden=false;
});

select(1,{instant:true});
})();
</script>
