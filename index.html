<style>
:root{
  --panel:#EEF0F3; --chip:#FFFFFF; --chip-line:#D6DAE1; --ink:#1F2530; --ink-dim:#5B6472;
  --accent:#E8930C; --vf:#000;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --panel:#1C2028; --chip:#272D38; --chip-line:#353D4B; --ink:#F3F0E8; --ink-dim:#9AA3B2; --accent:#FFB547;
  }
}
:root[data-theme="dark"]{
  --panel:#1C2028; --chip:#272D38; --chip-line:#353D4B; --ink:#F3F0E8; --ink-dim:#9AA3B2; --accent:#FFB547;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--panel)}
body{
  height:100%;margin:0;background:var(--panel);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
.app{height:100%;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:8px;padding:8px 12px}
.top h1{font-size:1rem;font-weight:700;margin:0;flex:1;letter-spacing:.02em}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--chip-line);background:var(--chip);
  border-radius:999px;padding:6px 12px;font-size:.8125rem}
.tbtn svg{width:16px;height:16px}
.tbtn[hidden]{display:none}

/* viewfinder */
.vf{position:relative;flex:1;min-height:0;background:var(--vf);overflow:hidden;touch-action:pan-y}
.vf video,.vf .still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf video.mirror{transform:scaleX(-1)}
.vf .still{display:none}
#guide{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;transition:opacity .2s}
.caption{position:absolute;left:0;right:0;bottom:0;padding:28px 16px 12px;
  background:linear-gradient(to top,rgba(0,0,0,.62),rgba(0,0,0,0));color:#fff;pointer-events:none}
.caption .nm{font-size:1.25rem;font-weight:700;line-height:1.3}
.caption .tp{font-size:.875rem;line-height:1.6;opacity:.9;max-width:34em}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.on{animation:fl .28s ease-out}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}

.start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;padding:24px;text-align:center;color:#fff;
  background:radial-gradient(ellipse at center,#2A3140 0%,#151820 80%)}
.start p{margin:0;line-height:1.7;font-size:.9375rem;max-width:22em;color:#D8DCE4}
.start .err{color:#FFC98A;font-size:.8125rem}
.pbtn{background:#FFB547;color:#2A1C05;border:0;border-radius:14px;padding:13px 26px;font-weight:700;font-size:1rem}
.sbtn{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.45);border-radius:14px;padding:11px 22px;font-size:.9375rem}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 6px;scroll-snap-type:x proximity;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;
  width:64px;padding:8px 4px 6px;border-radius:12px;background:var(--chip);border:1px solid var(--chip-line);
  color:var(--ink-dim);font-size:.6875rem;line-height:1.2}
.chip svg{width:30px;height:40px;display:block}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1px var(--accent)}

/* controls */
.ctrl{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:6px 16px 14px;gap:12px}
.side{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:var(--ink-dim);font-size:.75rem}
.side .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--chip);border:1px solid var(--chip-line);color:var(--ink)}
.side .ic svg{width:22px;height:22px}
.side:disabled{opacity:.35;cursor:default}
.side[aria-pressed="true"] .ic{background:var(--accent);border-color:var(--accent);color:#2A1C05}
.shutter{width:74px;height:74px;border-radius:50%;border:4px solid var(--ink);background:transparent;padding:4px}
.shutter span{display:block;width:100%;height:100%;border-radius:50%;background:var(--ink);transition:transform .1s}
.shutter:active span{transform:scale(.9)}
.shutter:disabled{opacity:.3}

/* preview sheet */
.sheet{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;background:rgba(10,12,16,.94);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.sheet.open{display:flex}
.sheet .imgwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.sheet img{max-width:100%;max-height:100%;border-radius:8px}
.sheet .row{display:flex;gap:12px;justify-content:center;padding-top:16px;flex-wrap:wrap}
.sheet .msg{text-align:center;font-size:.875rem;min-height:1.4em;padding-top:10px;color:#D8DCE4}
input[type=file]{display:none}
@media (prefers-reduced-motion:reduce){.flash.on{animation:none}#guide{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>カメラ</h1>
    <button class="tbtn" id="opBtn" aria-label="ガイドの濃さを切り替え">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M15 3v18M3 9h18M3 15h18" opacity=".6"/></svg>
      <span id="opLabel">濃い</span>
    </button>
    <button class="tbtn" id="flipCam" hidden aria-label="前後のカメラを切り替え">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3 3 0 0 1 5-2.2M15 13a3 3 0 0 1-5 2.2"/><path d="M14 9v2h-2M10 17v-2h2"/></svg>
      切替
    </button>
  </header>

  <main class="vf" id="vf">
    <video id="video" playsinline muted autoplay></video>
    <img class="still" id="still" alt="選んだ写真">
    <svg id="guide" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="caption"><div class="nm" id="cName"></div><div class="tp" id="cTip"></div></div>
    <div class="flash" id="flash"></div>
    <div class="start" id="start">
      <p>カメラの映像に構図ガイドを重ねます。<br>左右にスワイプすると構図が切り替わります。</p>
      <button class="pbtn" id="startCam">カメラを起動</button>
      <button class="sbtn" id="pickPhoto">撮った写真で確認する</button>
      <p class="err" id="err" hidden></p>
    </div>
  </main>

  <nav class="chips" id="chips" aria-label="構図を選ぶ"></nav>

  <div class="ctrl">
    <button class="side" id="variantBtn" aria-label="ガイドの向きを変える">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18" stroke-dasharray="2 3"/><path d="M8 7 3 12l5 5V7zM16 7l5 5-5 5V7z"/></svg></span>
      向きを変える
    </button>
    <button class="shutter" id="shutter" aria-label="撮影する" disabled><span></span></button>
    <button class="side" id="burnBtn" aria-pressed="false" aria-label="ガイド線も写真に入れる">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 5v14M15 5v14M3 10h18M3 14h18" opacity=".7"/></svg></span>
      線も写す
    </button>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-label="撮影した写真">
  <div class="imgwrap"><img id="shot" alt="撮影した写真"></div>
  <div class="msg" id="sheetMsg" aria-live="polite"></div>
  <div class="row">
    <button class="sbtn" id="retake">撮り直す</button>
    <button class="pbtn" id="save">保存する</button>
  </div>
</div>
<input type="file" id="file" accept="image/*">

<script>
(() => {
const PHI = (1 + Math.sqrt(5)) / 2;
const GUIDE = '#FFF7E6', ACC = '#FFB547';
const f = n => Math.round(n * 10) / 10;

/* drawing primitives */
function prims(sw, col, acc){
  const st = (op) => `stroke="${col}" stroke-width="${sw}" stroke-opacity="${op}" stroke-linecap="round" stroke-linejoin="round"`;
  return {
    L:(x1,y1,x2,y2,op=1,dash)=>`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" ${st(op)}${dash?` stroke-dasharray="${dash}"`:''}/>`,
    P:(d,op=1)=>`<path d="${d}" fill="none" ${st(op)}/>`,
    PL:(pts,op=1)=>`<polyline points="${pts.map(p=>f(p[0])+','+f(p[1])).join(' ')}" fill="none" ${st(op)}/>`,
    C:(cx,cy,r,op=1)=>`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" fill="none" ${st(op)}/>`,
    D:(cx,cy)=>`<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(sw*2.4)}" fill="${acc}"/>`,
    SHADE:(d,op)=>`<path d="${d}" fill="#000" fill-opacity="${op}" fill-rule="evenodd"/>`,
    sw
  };
}

/* golden spiral in a PHI x 1 box, returned as unit points */
function spiralPts(){
  let x=0,y=0,w=PHI,h=1; const pts=[];
  for(let i=0;i<11;i++){
    const k=i%4; let s,cx,cy,a0;
    if(k===0){s=h;cx=x+s;cy=y+s;a0=Math.PI;}
    if(k===1){s=w;cx=x;cy=y+s;a0=-Math.PI/2;}
    if(k===2){s=h;cx=x+w-s;cy=y;a0=0;}
    if(k===3){s=w;cx=x+w;cy=y+h-s;a0=Math.PI/2;}
    for(let j=(i?1:0);j<=14;j++){const a=a0+(Math.PI/2)*(j/14);pts.push([cx+s*Math.cos(a),cy+s*Math.sin(a)]);}
    if(k===0){x+=s;w-=s;} if(k===1){y+=s;h-=s;} if(k===2){w-=s;} if(k===3){h-=s;}
  }
  return pts;
}
const SPIRAL = spiralPts();
const EYE = [1.1180, 0.6910];

const COMPS = [
 {name:'日の丸',tip:'主役を画面の真ん中に。背景をシンプルにすると主役が強く伝わります。',
  draw:(W,H,v,g)=>{const r=Math.min(W,H)*.17,c=Math.min(W,H)*.04;
   return g.C(W/2,H/2,r,.9)+g.L(W/2-c,H/2,W/2+c,H/2)+g.L(W/2,H/2-c,W/2,H/2+c);}},
 {name:'三分割',tip:'主役を線の交点に置き、地平線は上か下の線に合わせます。',
  draw:(W,H,v,g)=>{let s='';for(const t of [1/3,2/3]){s+=g.L(W*t,0,W*t,H)+g.L(0,H*t,W,H*t);}
   for(const a of [1/3,2/3])for(const b of [1/3,2/3])s+=g.D(W*a,H*b);return s;}},
 {name:'二分割',tip:'空と地面、水面と景色などを半分ずつに。対称な被写体と好相性です。',variants:2,
  draw:(W,H,v,g)=>v?g.L(W/2,0,W/2,H):g.L(0,H/2,W,H/2)},
 {name:'四分割',tip:'三分割より細かく配置を決めたいときに。線上や交点に要素を置きます。',
  draw:(W,H,v,g)=>{let s='';for(const t of [.25,.5,.75]){const op=t===.5?1:.65;s+=g.L(W*t,0,W*t,H,op)+g.L(0,H*t,W,H*t,op);}return s;}},
 {name:'対角線',tip:'被写体を対角線に沿わせると、奥行きと動きが生まれます。',variants:2,mirror:true,
  draw:(W,H,v,g)=>{const len=Math.hypot(W,H),dx=W/len,dy=-H/len;
   const foot=(px,py)=>{const t=(px-0)*dx+(py-H)*dy;return [t*dx,H+t*dy];};
   const a=foot(0,0),b=foot(W,H);
   return g.L(0,H,W,0)+g.L(0,0,a[0],a[1],.55,'6 6')+g.L(W,H,b[0],b[1],.55,'6 6')+g.D(a[0],a[1])+g.D(b[0],b[1]);}},
 {name:'斜線',tip:'道や手すり、影などを斜めに入れて、リズムとスピード感を出します。',variants:2,mirror:true,
  draw:(W,H,v,g)=>{let s='';for(const o of [-.38,0,.38])s+=g.L(0,H*(.95+o),W,H*(.3+o),o?.7:1);return s;}},
 {name:'三角',tip:'底辺を広く、頂点に視線を集めます。山や人物の全身に安定感が出ます。',
  draw:(W,H,v,g)=>g.P(`M${f(W*.08)} ${f(H*.86)} L${f(W/2)} ${f(H*.2)} L${f(W*.92)} ${f(H*.86)} Z`)+g.D(W/2,H*.2)},
 {name:'逆三角',tip:'上を広く下をすぼめると、不安定さから緊張感や動きが生まれます。',
  draw:(W,H,v,g)=>g.P(`M${f(W*.08)} ${f(H*.14)} L${f(W/2)} ${f(H*.8)} L${f(W*.92)} ${f(H*.14)} Z`)+g.D(W/2,H*.8)},
 {name:'シンメトリー',tip:'中心線で左右（または上下）を対称に。建物や水面の映り込みに向きます。',variants:2,
  draw:(W,H,v,g)=>{const a=Math.min(W,H)*.06;
   if(!v)return g.L(W/2,0,W/2,H,1,'10 7')+g.P(`M${f(W/2-a*2)} ${f(H/2-a)} l${f(-a)} ${f(a)} l${f(a)} ${f(a)}`,.8)+g.P(`M${f(W/2+a*2)} ${f(H/2-a)} l${f(a)} ${f(a)} l${f(-a)} ${f(a)}`,.8);
   return g.L(0,H/2,W,H/2,1,'10 7')+g.P(`M${f(W/2-a)} ${f(H/2-a*2)} l${f(a)} ${f(-a)} l${f(a)} ${f(a)}`,.8)+g.P(`M${f(W/2-a)} ${f(H/2+a*2)} l${f(a)} ${f(a)} l${f(a)} ${f(-a)}`,.8);}},
 {name:'黄金螺旋',tip:'渦の中心に主役を置くと、自然で美しいバランスになります。',variants:4,mirror:true,
  draw:(W,H,v,g)=>{const land=W>=H;
   const map=([u,t])=>land?[u/PHI*W,t*H]:[(1-t)*W,u/PHI*H];
   let s='';for(const t of [1-1/PHI,1/PHI]){s+=g.L(W*t,0,W*t,H,.4)+g.L(0,H*t,W,H*t,.4);}
   s+=g.PL(SPIRAL.map(map));const e=map(EYE);return s+g.D(e[0],e[1]);}},
 {name:'S字',tip:'川や道のS字カーブで、視線を手前から奥へ導きます。',variants:2,mirror:true,
  draw:(W,H,v,g)=>g.P(`M${f(W*.32)} ${f(H)} C${f(W*.95)} ${f(H*.82)} ${f(W*.92)} ${f(H*.56)} ${f(W*.5)} ${f(H*.5)} S${f(W*.06)} ${f(H*.2)} ${f(W*.62)} 0`)},
 {name:'C字',tip:'海岸線や弧を描く道で、画面を包み込むような広がりを出します。',variants:2,mirror:true,
  draw:(W,H,v,g)=>g.P(`M${f(W*.82)} ${f(H*.04)} C${f(W*.02)} ${f(H*.18)} ${f(W*.02)} ${f(H*.82)} ${f(W*.82)} ${f(H*.96)}`)},
 {name:'放射線',tip:'一点から広がる線で奥行きと迫力を。中心の点に主役を置きます。',variants:2,
  draw:(W,H,v,g)=>{const px=W/2,py=v?H*2/3:H/2,R=Math.hypot(W,H);let s='';
   for(let i=0;i<16;i++){const a=i/16*Math.PI*2+Math.PI/16;s+=g.L(px+Math.cos(a)*R*.08,py+Math.sin(a)*R*.08,px+Math.cos(a)*R,py+Math.sin(a)*R,.75);}
   return s+g.D(px,py);}},
 {name:'トンネル',tip:'窓やトンネル、木々で手前に枠を作り、奥の主役を囲みます。',
  draw:(W,H,v,g)=>{const ix=W*.16,iy=H*.14,r=Math.min(W,H)*.06,w=W-ix*2,h=H-iy*2;
   const inner=`M${f(ix+r)} ${f(iy)} h${f(w-2*r)} a${f(r)} ${f(r)} 0 0 1 ${f(r)} ${f(r)} v${f(h-2*r)} a${f(r)} ${f(r)} 0 0 1 ${f(-r)} ${f(r)} h${f(-(w-2*r))} a${f(r)} ${f(r)} 0 0 1 ${f(-r)} ${f(-r)} v${f(-(h-2*r))} a${f(r)} ${f(r)} 0 0 1 ${f(r)} ${f(-r)} Z`;
   return g.SHADE(`M0 0 H${f(W)} V${f(H)} H0 Z `+inner,.28)+g.P(inner)+g.D(W/2,H/2);}},
 {name:'パターン',tip:'同じ形の繰り返しで画面を埋めます。ひとつだけ崩すと印象的になります。',
  draw:(W,H,v,g)=>{const cols=4,rows=Math.max(3,Math.round(cols*H/W)),cw=W/cols,ch=H/rows,r=Math.min(cw,ch)*.24;let s='';
   for(let i=1;i<cols;i++)s+=g.L(cw*i,0,cw*i,H,.3);for(let j=1;j<rows;j++)s+=g.L(0,ch*j,W,ch*j,.3);
   for(let i=0;i<cols;i++)for(let j=0;j<rows;j++)s+=g.C(cw*(i+.5),ch*(j+.5),r,.85);return s;}}
];

function buildInner(c, W, H, v, sw, col, acc){
  const g = prims(sw, col, acc);
  let inner = c.draw(W, H, v, g);
  if(c.mirror && v){
    const mx = v & 1, my = v & 2;
    inner = `<g transform="translate(${mx?W:0} ${my?H:0}) scale(${mx?-1:1} ${my?-1:1})">${inner}</g>`;
  }
  return inner;
}
function buildSvg(c, W, H, v, sw){
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">`+
    `<defs><filter id="sh" x="-5%" y="-5%" width="110%" height="110%"><feDropShadow dx="0" dy="0" stdDeviation="${f(sw*.8)}" flood-color="#000" flood-opacity=".65"/></filter></defs>`+
    `<g filter="url(#sh)">${buildInner(c,W,H,v,sw,GUIDE,ACC)}</g></svg>`;
}

/* state */
const $ = id => document.getElementById(id);
const vf=$('vf'), video=$('video'), still=$('still'), guide=$('guide');
let idx=1, variant=0, opLevel=0, burn=false, facing='environment', stream=null, source=null, downloads=null;
const OPS=[{l:'濃い',o:1},{l:'薄い',o:.5},{l:'非表示',o:0}];

/* chips */
const chips=$('chips');
COMPS.forEach((c,i)=>{
  const b=document.createElement('button');b.className='chip';b.type='button';
  b.innerHTML=`<svg viewBox="0 0 30 40" aria-hidden="true"><rect x=".75" y=".75" width="28.5" height="38.5" rx="3" fill="none" stroke="currentColor" stroke-opacity=".35" stroke-width="1"/>${buildInner(c,30,40,0,1.2,'currentColor','currentColor')}</svg>${c.name}`;
  b.addEventListener('click',()=>select(i));
  chips.appendChild(b);
});

function render(){
  const W=vf.clientWidth,H=vf.clientHeight; if(!W||!H)return;
  const c=COMPS[idx], sw=Math.max(1.5,Math.min(W,H)/240);
  guide.setAttribute('viewBox',`0 0 ${W} ${H}`);
  guide.innerHTML=buildSvg(c,W,H,variant,sw).replace(/^<svg[^>]*>|<\/svg>$/g,'');
  guide.style.opacity=OPS[opLevel].o;
}
function select(i){
  idx=(i+COMPS.length)%COMPS.length; variant=0;
  const c=COMPS[idx];
  $('cName').textContent=c.name+'構図'; $('cTip').textContent=c.tip;
  [...chips.children].forEach((b,j)=>b.setAttribute('aria-pressed',j===idx));
  chips.children[idx].scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  $('variantBtn').disabled=!(c.variants>1);
  render();
}
$('variantBtn').addEventListener('click',()=>{const n=COMPS[idx].variants||1;variant=(variant+1)%n;render();});
$('opBtn').addEventListener('click',()=>{opLevel=(opLevel+1)%OPS.length;$('opLabel').textContent=OPS[opLevel].l;render();});
$('burnBtn').addEventListener('click',e=>{burn=!burn;e.currentTarget.setAttribute('aria-pressed',burn);});
new ResizeObserver(render).observe(vf);

/* swipe to change composition */
let sx=null,sy=null;
vf.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});
vf.addEventListener('pointerup',e=>{
  if(sx===null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3)select(idx+(dx<0?1:-1));
});

/* camera */
function showErr(msg){const el=$('err');el.textContent=msg;el.hidden=false;$('start').style.display='flex';}
async function startCamera(){
  if(!navigator.mediaDevices?.getUserMedia){showErr('このブラウザではカメラを使えません。「撮った写真で確認する」をお試しください。');return;}
  try{
    stream?.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1440}}});
    video.srcObject=stream; await video.play();
    video.classList.toggle('mirror',facing==='user');
    video.style.display='block'; still.style.display='none'; source='video';
    $('start').style.display='none'; $('shutter').disabled=false; $('flipCam').hidden=false;
  }catch(err){
    const n=err&&err.name;
    showErr(n==='NotAllowedError'?'カメラの使用が許可されませんでした。ブラウザの設定でカメラを許可してから再度お試しください。':
      n==='NotFoundError'?'カメラが見つかりませんでした。':'カメラを起動できませんでした（'+(n||'不明なエラー')+'）。');
  }
}
$('startCam').addEventListener('click',startCamera);
$('flipCam').addEventListener('click',()=>{facing=facing==='environment'?'user':'environment';startCamera();});
$('pickPhoto').addEventListener('click',()=>$('file').click());
$('file').addEventListener('change',e=>{
  const fl=e.target.files[0];if(!fl)return;
  still.onload=()=>{still.style.display='block';video.style.display='none';source='still';
    $('start').style.display='none';$('shutter').disabled=false;};
  still.src=URL.createObjectURL(fl); e.target.value='';
});

/* capture */
let lastBlob=null;
async function capture(){
  const el=source==='video'?video:still;
  const iw=source==='video'?video.videoWidth:still.naturalWidth, ih=source==='video'?video.videoHeight:still.naturalHeight;
  if(!iw||!ih)return;
  const Dw=vf.clientWidth,Dh=vf.clientHeight,s=Math.max(Dw/iw,Dh/ih);
  const cw=Math.round(Dw/s),ch=Math.round(Dh/s),sx0=(iw-cw)/2,sy0=(ih-ch)/2;
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;const ctx=cv.getContext('2d');
  ctx.save(); if(source==='video'&&facing==='user'){ctx.translate(cw,0);ctx.scale(-1,1);}
  ctx.drawImage(el,sx0,sy0,cw,ch,0,0,cw,ch); ctx.restore();
  if(burn&&OPS[opLevel].o>0){
    const svg=buildSvg(COMPS[idx],cw,ch,variant,Math.max(2,Math.min(cw,ch)/240));
    const url=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));
    await new Promise(res=>{const im=new Image();im.onload=()=>{ctx.globalAlpha=OPS[opLevel].o;ctx.drawImage(im,0,0,cw,ch);ctx.globalAlpha=1;URL.revokeObjectURL(url);res();};im.onerror=res;im.src=url;});
  }
  lastBlob=await new Promise(r=>cv.toBlob(r,'image/jpeg',.92));
  $('shot').src=URL.createObjectURL(lastBlob); $('sheetMsg').textContent=''; $('sheet').classList.add('open');
}
$('shutter').addEventListener('click',()=>{
  const fl=$('flash');fl.classList.remove('on');void fl.offsetWidth;fl.classList.add('on');
  navigator.vibrate?.(12); capture();
});
$('retake').addEventListener('click',()=>$('sheet').classList.remove('open'));

/* saving: Claude artifact downloads capability, else a normal download link */
(async()=>{try{if(window.claude?.use)downloads=await window.claude.use('downloads');}catch(e){downloads=null;}})();
function fname(){const d=new Date(),p=n=>String(n).padStart(2,'0');
  return `kozu-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;}
$('save').addEventListener('click',async()=>{
  if(!lastBlob)return; const msg=$('sheetMsg'), name=fname();
  if(downloads){
    try{await downloads.save({filename:name,data:lastBlob});msg.textContent='保存しました';}
    catch(e){msg.textContent=e?.code==='declined'?'保存をキャンセルしました':'保存できませんでした（'+(e?.code||'エラー')+'）';}
    return;
  }
  const file=new File([lastBlob],name,{type:'image/jpeg'});
  if(navigator.canShare?.({files:[file]})){
    try{await navigator.share({files:[file]});msg.textContent='「画像を保存」で写真アプリに保存できます';}
    catch(e){if(e?.name!=='AbortError')msg.textContent='共有できませんでした';}
    return;
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(lastBlob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  msg.textContent='保存しました';
});

select(1);
})();
</script>
